name: 'Asset Doctor budget'
description: 'Gate a PR on an HTML5-game asset budget (disk, VRAM, atlasing) — measured locally on the runner, never uploaded.'
branding:
  icon: 'activity'
  color: 'green'

inputs:
  dir:
    description: 'Assets directory to audit.'
    required: false
    default: 'assets'
  config:
    description: 'Path to asset-doctor.budget.json (else auto-discovered; no config = advisory).'
    required: false
    default: ''
  base-ref:
    description: 'Base git ref for the before/after baseline. Defaults to the PR base SHA.'
    required: false
    default: ''
  fail-on:
    description: 'error | warn | none — which level flips the build red.'
    required: false
    default: 'error'
  warn-only:
    description: 'true to never fail the build (report only).'
    required: false
    default: 'false'
  annotate:
    description: 'true to emit inline file annotations.'
    required: false
    default: 'true'
  summary:
    description: 'true to write the budget table to the job summary.'
    required: false
    default: 'true'
  pr-comment:
    description: 'true to post/update ONE sticky PR comment with the measured before→after diff (metric deltas + added/resolved/changed findings). Advisory and best-effort: it never fails the build and never gates.'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to post the PR comment (needs pull-requests: write). Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install pnpm
      shell: bash
      # Install directly (not pnpm/action-setup) so it works for ANY caller repo, regardless of whether
      # they pin pnpm via packageManager — action-setup errors if version is set AND packageManager exists.
      run: npm install -g pnpm@10

    - name: Build the asset-doctor CLI (from the action checkout)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter @asset-doctor/cli build

    - name: Baseline (base ref) — best effort, never fails
      shell: bash
      run: |
        BIN="node ${{ github.action_path }}/apps/cli/dist/cli.js"
        BASE="${{ inputs.base-ref }}"
        [ -z "$BASE" ] && BASE="${{ github.event.pull_request.base.sha }}"
        if [ -n "$BASE" ] && git rev-parse --verify "$BASE" >/dev/null 2>&1; then
          if git worktree add "$RUNNER_TEMP/ad-base" "$BASE" >/dev/null 2>&1; then
            $BIN audit "$RUNNER_TEMP/ad-base/${{ inputs.dir }}" --json --out "$RUNNER_TEMP/ad-base.json" --quiet 2>/dev/null \
              && echo "baseline captured at $BASE" || echo "baseline scan skipped (no assets at base)"
            git worktree remove --force "$RUNNER_TEMP/ad-base" 2>/dev/null || true
          else
            echo "baseline worktree failed (fork/shallow PR?) — gating absolute budgets only"
          fi
        else
          echo "no base ref — gating absolute budgets only"
        fi

    # P9 — the sticky PR comment. ADVISORY by design and placed BEFORE the Gate so a failing budget never
    # skips it (the comment is exactly when a red build most needs the measured story). Every path is
    # best-effort (exit 0): a missing baseline, a diff failure, no gh binary (self-hosted), or a token
    # without pull-requests:write must never break the build. Reuses the CLI diff core verbatim — the
    # comment IS `asset-doctor diff --summary` (measured deltas + added/resolved/changed by stable id),
    # nothing recomputed here. Sticky: ONE comment per PR, matched by the HTML marker and updated in place.
    - name: PR comment — measured before→after diff (advisory, best effort)
      if: ${{ inputs.pr-comment == 'true' && github.event.pull_request.number }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        BIN="node ${{ github.action_path }}/apps/cli/dist/cli.js"
        command -v gh >/dev/null 2>&1 || { echo "gh not available — skipping PR comment"; exit 0; }
        [ -f "$RUNNER_TEMP/ad-base.json" ] || { echo "no baseline — skipping PR comment"; exit 0; }
        $BIN diff "$RUNNER_TEMP/ad-base.json" "${{ inputs.dir }}" --summary "$RUNNER_TEMP/ad-diff.md" --quiet \
          || { echo "diff failed — skipping PR comment"; exit 0; }
        MARKER="<!-- asset-doctor-diff -->"
        { echo "$MARKER"; cat "$RUNNER_TEMP/ad-diff.md"; } > "$RUNNER_TEMP/ad-comment.md"
        PR="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" 2>/dev/null | head -n1)
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@"$RUNNER_TEMP/ad-comment.md" >/dev/null \
            && echo "PR comment updated (#$EXISTING)" || echo "PR comment update failed (token perms?) — skipped"
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/ad-comment.md" >/dev/null \
            && echo "PR comment posted" || echo "PR comment failed (token perms?) — skipped"
        fi
        exit 0

    - name: Gate
      shell: bash
      run: |
        BIN="node ${{ github.action_path }}/apps/cli/dist/cli.js"
        ARGS=(budget "${{ inputs.dir }}")
        [ -n "${{ inputs.config }}" ] && ARGS+=(--config "${{ inputs.config }}")
        [ -f "$RUNNER_TEMP/ad-base.json" ] && ARGS+=(--baseline "$RUNNER_TEMP/ad-base.json")
        ARGS+=(--fail-on "${{ inputs.fail-on }}")
        [ "${{ inputs.warn-only }}" = "true" ] && ARGS+=(--warn-only)
        [ "${{ inputs.annotate }}" = "true" ] && ARGS+=(--annotate)
        [ "${{ inputs.summary }}" = "true" ] && ARGS+=(--summary "$GITHUB_STEP_SUMMARY")
        echo "+ asset-doctor ${ARGS[*]}"
        $BIN "${ARGS[@]}"
